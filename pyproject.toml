[project]
name = "financial-time-series-forecasting"
version = "0.1.0"
description = "codebase for bachelor thesis"
authors = [
    {name = "florian.ullmann@study.thws.de",email = "florian.ullmann@study.thws.de"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "ta-lib (>=0.6.8,<0.7.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
